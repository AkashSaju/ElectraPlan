<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>electra plan - Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    .main-logo {
  animation: logo-glow 4s infinite ease-in-out;
}

@keyframes logo-glow {
  0%, 100% { filter: drop-shadow(0 0 5px var(--primary)); opacity: 0.9; }
  50% { filter: drop-shadow(0 0 15px var(--neon-cyan)); opacity: 1; }
}
    /* 1. VARIABLES & CORE STYLES */
    :root {
      --bg-dark: #020617;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --neon-cyan: #00f3ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 2. THE UNIVERSE (Background Layers) */
    .mpr-universe {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--bg-dark);
    }

    #circuitCanvas {
      position: absolute;
      inset: 0;
      filter: blur(0.5px);
    }

    .power-grid-overlay {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 80px 80px;
      transform: perspective(1000px) rotateX(60deg);
      animation: grid-drift 60s infinite linear;
    }

    .extra-glass {
      position: absolute;
      background: rgba(255, 255, 255, 0.01);
      backdrop-filter: blur(25px) saturate(150%);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
    }

    .g-1 { width: 450px; height: 450px; top: -150px; right: -100px; transform: rotate(15deg); }
    .g-2 { width: 300px; height: 300px; bottom: -50px; left: 5%; transform: rotate(-12deg); }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 30%, rgba(2, 6, 23, 0.9) 100%);
      pointer-events: none;
    }

    /* 3. CONTENT UI */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      background: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand .title {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      position: relative;
    }

    .dashboard-header h2 {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -1px;
    }

    /* Input Styling */
    .plan-form {
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      margin: 40px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .input-field {
      background: transparent;
      border: none;
      color: white;
      padding: 0 15px;
      flex-grow: 1;
      font-size: 15px;
      outline: none;
    }

    button.primary {
      background: var(--primary);
      color: rgb(228, 227, 228);
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button.primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
    }

    /* Card Styling */
    .plans-grid { display: grid; gap: 16px; }

    .plan-card {
      padding: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(30px);
      animation: bootUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes bootUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .plan-card:hover {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.06);
      transform: translateX(8px);
    }

    .plan-info-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .plan-info-id { font-size: 12px; color: var(--text-muted); font-family: monospace; }

    button.secondary {
      background: rgba(255,255,255,0.05);
      color: rgb(255, 255, 255);
      border: 1px solid var(--card-border);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button.secondary:hover {
      background: var(--Secondaryhover--);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
    }

    /* Animations */
    @keyframes grid-drift {
      from { transform: perspective(1000px) rotateX(60deg) translateY(0); }
      to { transform: perspective(1000px) rotateX(60deg) translateY(80px); }
    }

    .brand {
  display: flex;
  align-items: center;
  gap: 15px; /* Space between logo and text */
}

.logo-container {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;  /* Adjust size as needed */
  height: 40px;
}

.main-logo {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  /* Optional: adds a slight glow to match the workstation theme */
  filter: drop-shadow(0 0 8px var(--primary)); 
}

.brand .title {
  font-weight: 800;
  font-size: 1.2rem;
  letter-spacing: 1px;
  /* ... existing gradient styles ... */
}
    
  </style>
</head>

<body>
  <div class="mpr-universe">
    <div class="power-grid-overlay"></div>
    <canvas id="circuitCanvas"></canvas>
    <div class="extra-glass g-1"></div>
    <div class="extra-glass g-2"></div>
    <div class="vignette"></div>
  </div>

  <header class="top-bar">
  <div class="brand">
    <div class="logo-container">
       <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="main-logo">
    </div>
    <span class="title">ELECTRA PLAN</span>
  </div>
  <div class="actions">
    <span style="color: var(--text-muted); font-size: 13px; margin-right: 15px;">Operator: {{ username }}</span>
    <a href="/logout" style="text-decoration:none;">
      <button class="secondary" style="border-color: rgba(239, 68, 68, 0.4); color: #ef4444;">Log Out</button>
    </a>
  </div>
</header>

  <main class="container">
    <div class="dashboard-header">
      <h2>Your Plans</h2>
      <p style="color: var(--text-muted); margin-top: 8px;">Intelligent electrical design and maintenance.</p>
    </div>

    <form method="POST" action="/new-plan" class="plan-form">
      <input class="input-field" name="name" placeholder="E.g. Ground Floor Wiring" required>
      <button class="primary" type="submit">Create New Plan</button>
    </form>

   <div class="plans-grid">
  {% for plan in plans %}
    <div class="plan-card" style="animation-delay: {{ loop.index0 * 0.08 }}s;">
      <div class="plan-main-info">
        <div class="plan-info-name">{{ plan.name }}</div>
        <div class="plan-info-id">ID: #{{ plan.id }}</div>
      </div>

      <div class="plan-actions">
        <a href="/editor/{{ plan.id }}">
          <button class="secondary">Open Project</button>
        </a>

        <form action="/delete-plan/{{ plan.id }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this plan?');" style="display: inline;">
          <button type="submit" class="delete-btn" title="Delete Plan">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
          </button>
        </form>
      </div>
    </div>
  {% endfor %}
</div>
  </main>

  <script>
    const canvas = document.getElementById('circuitCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, points = [];

    function init() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      points = [];
      for(let i=0; i<18; i++) {
        points.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      ctx.lineWidth = 1;

      points.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        if(p.x < 0 || p.x > width) p.vx *= -1;
        if(p.y < 0 || p.y > height) p.vy *= -1;

        for(let j=i+1; j<points.length; j++) {
          const p2 = points[j];
          const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if(dist < 320) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(99, 102, 241, ${0.15 * (1 - dist/320)})`;
            ctx.moveTo(p.x, p.y);
            // Extra-Oriented (Right-angle) lines
            ctx.lineTo(p2.x, p.y); 
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();

            // Rare electrical spark
            if(Math.random() > 0.998) {
              ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
              ctx.stroke();
            }
          }
        }
      });
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', init);
    init();
    draw();
  </script>
</body>
</html>
