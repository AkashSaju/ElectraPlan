<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electra Plan - Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <header class="top-bar">
    <div class="brand">
      <span class="logo"></span>
      <span class="title">Electra Plan</span>
      <span style="color: var(--text-muted); font-size: 13px;">
        / {{ plan_name }} (ID: {{ plan_id }})
      </span>
    </div>

    <div class="actions">
      <button class="primary" onclick="savePlan()">Save</button>
      <button class="secondary" onclick="triggerImport()">Import Plan</button>
      <button class="secondary" onclick="detectWalls()">Detect Walls</button>
      <a href="/" style="text-decoration:none;">
        <button class="secondary">Dashboard</button>
      </a>
      <a href="/electrical-templates/{{ plan_id }}" style="text-decoration:none;">
  <button class="secondary">Electrical Templates</button>
</a>

    </div>
  </header>

  <div class="app-container">
    <aside class="panel left-panel">
      <h4>Architecture</h4>
      <button class="tool-btn" onclick="setTool('select')">Select / Move</button>
      <button class="tool-btn" onclick="setTool('wall')">Wall Tool</button>
      <button class="tool-btn" onclick="setTool('room')">Room Tool</button>
      <button class="tool-btn" onclick="setTool('door')">Door Tool</button>
      <button class="tool-btn" onclick="setTool('window')">Window Tool</button>
      <button class="tool-btn" onclick="setTool('measure')">Measure Tool</button>
      <button class="tool-btn" onclick="setTool('counter')">Counter Tool</button>
      <button class="tool-btn" onclick="setTool('sink')">Sink Tool</button>
      <hr class="divider"/>

      <label class="label">Room Name</label>
      <select id="roomName" class="input">
        <option value="Living">Living</option>
        <option value="Bedroom 1">Bedroom 1</option>
        <option value="Bedroom 2">Bedroom 2</option>
        <option value="Kitchen">Kitchen</option>
        <option value="Bath">Bath</option>
        <option value="Balcony">Balcony</option>
        <option value="Custom">Custom</option>
      </select>

      <hr class="divider"/>

      <button class="tool-btn danger" onclick="deleteSelected()">Delete Selected</button>
      <button class="tool-btn" onclick="clearAll()">Clear All</button>

      <div class="hint">
        <p><b>Pan:</b> Hold SPACE + Drag</p>
        <p><b>Rotate Door:</b> Select + Press R</p>
      </div>
    </aside>

    <main class="canvas-container">
      <canvas id="designCanvas"></canvas>
    </main>

    <aside class="panel right-panel">
      <h4>Plan Info</h4>
      <p style="font-size:12px; color: var(--text-muted); line-height: 1.4;">
        Plan editing active. Save will update the same Plan ID.
      </p>
    </aside>
  </div>

  <input type="file" id="planFile" accept="image/png,image/jpeg" hidden />

  <script>
  window.PLAN_ID = parseInt("{{ plan_id }}", 10);
</script>



  <script src="{{ url_for('static', filename='canvas.js') }}"></script>
</body>
</html>
