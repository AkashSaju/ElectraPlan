<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electra Plan - Engineering Terminal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
  :root {
  --bg-void: #020617;
  --glass-panel: rgba(15, 23, 42, 0.7);
  --glass-border: rgba(34, 211, 238, 0.15);
  --electra-blue: #22d3ee;
  --electra-glow: rgba(34, 211, 238, 0.3);
  --power-indigo: #6366f1;
  --text-main: #f8fafc;
  --text-dim: #64748b;
  --danger: #ef4444;
}

body {
  margin: 0;
  height: 100vh;
  background: var(--bg-void);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  overflow: hidden; /* Fixes the main screen */
  display: flex;
  flex-direction: column;
}

/* --- TOP BAR --- */
.top-bar {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--glass-panel);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  z-index: 100;
  flex-shrink: 0;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand .logo-orb {
  width: 12px; height: 12px; 
  background: var(--electra-blue); 
  border-radius: 50%; 
  box-shadow: 0 0 15px var(--electra-blue);
}
.brand .title {
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 2px;
  text-transform: uppercase;
  
  /* The Gradient Magic */
  background: linear-gradient(
    to bottom,
    #fff 20%, 
    var(--electra-blue) 50%, 
    #0891b2 80%
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  
  /* Subtle Outer Glow */
  filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.3));
}
/* --- LAYOUT --- */
.app-container {
  display: flex;
  flex: 1;
  padding: 16px;
  gap: 16px;
  height: calc(100vh - 60px);
  overflow: hidden; /* Ensures only internal elements scroll */
}

.panel {
  width: 250px;
  background: var(--glass-panel);
  backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.panel h4 {
  font-size: 10px; color: var(--electra-blue);
  text-transform: uppercase; letter-spacing: 1.5px;
  margin: 0 0 16px 0; border-bottom: 1px solid var(--glass-border);
  padding-bottom: 8px;
  flex-shrink: 0;
}

/* --- INTERNAL SCROLLING LOGIC --- */
.tool-list {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 8px;
  margin-bottom: 10px;
}

/* Custom Neon Scrollbar */
.tool-list::-webkit-scrollbar {
  width: 4px;
}
.tool-list::-webkit-scrollbar-track {
  background: transparent;
}
.tool-list::-webkit-scrollbar-thumb {
  background: var(--glass-border);
  border-radius: 10px;
}
.tool-list::-webkit-scrollbar-thumb:hover {
  background: var(--electra-blue);
}

.panel-footer {
  flex-shrink: 0;
  padding-top: 10px;
}

/* --- TOOLS --- */
.tool-btn {
  width: 100%; padding: 12px; margin-bottom: 8px;
  background: rgba(222, 222, 222, 0.03); color: var(--text-dim);
  border: 1px solid var(--glass-border); border-radius: 12px;
  font-size: 13px; text-align: left; cursor: pointer;
  transition: all 0.2s;
}
.tool-btn:hover {
  background: rgba(34, 211, 238, 0.1); color: #fff;
  border-color: var(--electra-blue); transform: translateX(4px);
}
.tool-btn.active {
  background: var(--power-indigo); color: #fff;
  border-color: var(--electra-blue); box-shadow: 0 0 15px var(--electra-glow);
}

/* --- CANVAS --- */
.canvas-container {
  flex: 1;
  background: #0f172a;
  border-radius: 24px;
  position: relative;
  border: 1px solid var(--glass-border);
  overflow: hidden;
}
canvas { width: 100%; height: 100%; cursor: crosshair; }

.canvas-container::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(var(--glass-border) 1px, transparent 1px);
  background-size: 32px 32px; pointer-events: none;
}

/* --- INPUTS & BUTTONS --- */
.input {
  width: 100%; background: rgba(0,0,0,0.3);
  border: 1px solid var(--glass-border); color: #fff;
  padding: 10px; border-radius: 8px; outline: none;
}
.primary {
  background: var(--power-indigo); color: #fff; border: none;
  padding: 8px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;
}
.secondary {
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--glass-border); padding: 8px 16px;
  border-radius: 8px; cursor: pointer; margin-left: 8px;
}
.danger { border-color: var(--danger); color: var(--danger); }
.danger:hover { background: var(--danger); color: #fff; }

.hint { font-size: 11px; color: var(--text-dim); margin-top: 15px; line-height: 1.6; }

/* --- CONTEXT MENU (UX) --- */
.context-menu {
  position: absolute; z-index: 1000; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(25px);
  border: 1px solid var(--glass-border); border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 15px rgba(34, 211, 238, 0.05); padding: 8px;
  display: flex; flex-direction: column; min-width: 140px; transform: scale(0.95); opacity: 0; pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.context-menu.open { transform: scale(1); opacity: 1; pointer-events: auto; }
.cm-item {
  padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #e2e8f0; transition: 0.2s;
  display: flex; align-items: center; gap: 10px; font-weight: 600;
}
.cm-item:hover { background: rgba(34, 211, 238, 0.15); color: var(--electra-blue); }
.cm-item.danger-text:hover { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
.cm-item.danger-text:hover { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

/* --- CUSTOM SELECT DROPDOWN --- */
.custom-select {
  width: 100%;
  padding: 12px 14px;
  background-color: rgba(0, 0, 0, 0.4);
  color: #fff;
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-image: url('data:image/svg+xml;utf8,<svg fill="%2322d3ee" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
  background-repeat: no-repeat;
  background-position: right 10px top 50%;
  transition: 0.3s;
}

.custom-select:hover, .custom-select:focus {
  border-color: var(--electra-blue);
  box-shadow: 0 0 10px rgba(34, 211, 238, 0.1);
}

.custom-select option {
  background-color: var(--bg-void);
  color: #fff;
  padding: 10px;
}
</style>
</head>

<body>
  <header class="top-bar">
    <div class="brand">
      <div class="logo-orb"></div>
      <span class="title">ELECTRA PLAN</span>
      <span style="color: var(--text-dim); font-size: 12px; margin-left: 12px; opacity: 0.6;">
        // EDITOR: {{ plan_name }} (ID: {{ plan_id }})
      </span>
    </div>

    <div class="actions" style="display: flex; gap: 10px;">
      <button class="primary" onclick="savePlan()" style="display: flex; align-items: center; gap: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Save to Cloud
      </button>
      <button class="secondary" onclick="triggerImport()" style="display: flex; align-items: center; gap: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Import Plan
      </button>
      <button class="secondary" onclick="detectWalls()" style="display: flex; align-items: center; gap: 8px; border-color: rgba(163, 230, 53, 0.4); color: #a3e635;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg> AI Analysis
      </button>
      <a href="/dashboard" style="text-decoration:none; margin-left: auto;">
        <button class="secondary" style="display: flex; align-items: center; gap: 8px; border-color: rgba(239, 68, 68, 0.4); color: #ef4444;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> Exit
        </button>
      </a>
    </div>
  </header>

  <div class="app-container">
    <aside class="panel">
    <h4>Architecture</h4>
    
    <div class="tool-list">
        <button class="tool-btn" id="tool-select" onclick="setTool('select')">Select / Move</button>
        <button class="tool-btn" id="tool-wall" onclick="setTool('wall')">Wall Tool</button>
        <button class="tool-btn" id="tool-room" onclick="setTool('room')">Room Tool</button>
        <button class="tool-btn" id="tool-door" onclick="setTool('door')">Door Tool</button>
        <button class="tool-btn" id="tool-window" onclick="setTool('window')">Window Tool</button>
        <button class="tool-btn" id="btn-counter" onclick="setTool('counter')">Counter Tool</button>
        <button class="tool-btn" id="btn-sink" onclick="setTool('sink')">Sink Tool</button>
        
        <hr style="border:0; border-top:1px solid var(--glass-border); margin:15px 0;">

        <label class="hint" style="display:block; margin-bottom:8px; color: var(--electra-blue);">ROOM IDENTIFIER</label>
        <select id="roomName" class="custom-select">
            <option value="Living">Living Room</option>
            <option value="Bedroom 1">Bedroom 1</option>
            <option value="Kitchen">Kitchen</option>
            <option value="Bath">Bathroom</option>
            <option value="Custom">Custom Area</option>
        </select>
    </div>

    <div class="panel-footer">
        <button class="tool-btn danger" onclick="deleteSelected()">delete Selected</button>
        <button class="tool-btn" onclick="clearAll()" style="opacity:1;">Clear Canvas</button>
    </div>
</aside>
    <main class="canvas-container">
      <canvas id="designCanvas"></canvas>
    </main>

    <aside class="panel" style="width: 200px;">
      <h4>System Intel</h4>
      <div class="hint">
        <p><b>Pan View:</b> SPACE + Drag</p>
        <p><b>Rotate:</b> Select + [R]</p>
        <p><b>Delete:</b> [DEL] Key</p>
      </div>
      <hr style="border:0; border-top:1px solid var(--glass-border); margin:20px 0;">
      <a href="/electrical-templates/{{ plan_id }}" style="text-decoration:none;">
        <button class="tool-btn" style="border-color: var(--electra-blue); color: var(--electra-blue); text-align: center;">
          ⚡ Electrical Library
        </button>
      </a>
    </aside>
  </div>

  <input type="file" id="planFile" accept="image/png,image/jpeg" hidden />

  <!-- UX: Custom Glassmorphic Context Menu -->
  <div id="contextMenu" class="context-menu">
    <div class="cm-item" id="cm-rotate" onclick="handleCMRotate()">⟳ Rotate Element</div>
    <div class="cm-item danger-text" id="cm-delete" onclick="handleCMDelete()">🗑️ Delete Element</div>
  </div>

  <script>
    window.PLAN_ID = parseInt("{{ plan_id }}", 10);
    
    // UI Functionality Wrapper to highlight active tool
    function setTool(tool) {
        // Clear active class from all
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        // Add to clicked (assuming ID matches tool name for easy logic)
        const activeBtn = document.getElementById('tool-' + tool);
        if(activeBtn) activeBtn.classList.add('active');
        
        // Original functionality call
        if(typeof window.setToolOriginal === 'function') {
           window.setToolOriginal(tool); 
        }
    }
  </script>
  <script src="{{ url_for('static', filename='canvas.js') }}"></script>
</body>
</html>
